/**:
  ros__parameters:
    inputs: ['velodyne_cloud', 'camera_cloud']
    velodyne_cloud:
      type: pointcloud # Supported types: pointcloud
      topic: /velodyne_points_filtered
      queue_size: 1
      publish_on_update: true
      sensor_processor:
        type: laser
        min_radius: 0.015
        beam_angle: 0.0014
        beam_constant: 0.0015
        apply_voxelgrid_filter: true
        voxelgrid_filter_size: 0.15
        ignore_points_above: 2.0
        ignore_points_below: -2.0

    camera_cloud:
      type: pointcloud
      topic: /merged_points_filtered
      queue_size: 1
      publish_on_update: true
      sensor_processor:
        type: laser
        min_radius: 0.03
        beam_angle: 0.003
        beam_constant: 0.005
        apply_voxelgrid_filter: true
        voxelgrid_filter_size: 0.20
        ignore_points_above: 2.0
        ignore_points_below: -1.5

    # Use TF only (no odometry topic). This is useful to test with a fixed sensor.
    # Leaving this empty makes elevation_mapping skip pose covariance updates.
    robot_pose_with_covariance_topic: ""
    robot_pose_cache_size: 1

    map_frame_id: "map"
    robot_base_frame_id: "base_link"
    track_point_frame_id: "base_link"
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0
    use_sim_time: false
